spring:
  application:
    name: family-cooking-tracker
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:family_cooking}}
    username: ${DB_USERNAME:family_cooking}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: 0
      data-source-properties:
        sslmode: ${DB_SSL_MODE:prefer}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
      file-size-threshold: 0

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  tomcat:
    # Drain ordinary oversized uploads so the browser receives the JSON 413.
    # Keep draining bounded; accepted multipart requests are still limited to 6 MiB.
    max-swallow-size: 8MB
  servlet:
    session:
      timeout: 30d
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: ${SESSION_COOKIE_SAME_SITE:lax}

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  endpoints:
    web:
      exposure:
        include: health,info

app:
  photos:
    enabled: ${PHOTO_STORAGE_ENABLED:false}
    heic-python: ${PHOTO_HEIC_PYTHON:python3}
    supabase-url: ${SUPABASE_URL:}
    secret-key: ${SUPABASE_SECRET_KEY:}
    dish-bucket: ${STORAGE_DISH_PHOTOS_BUCKET:dish-photos}
    recipe-bucket: ${STORAGE_RECIPE_PHOTOS_BUCKET:recipe-photos}
    avatar-bucket: ${STORAGE_AVATARS_BUCKET:avatars}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  bootstrap-admin:
    email: ${BOOTSTRAP_ADMIN_EMAIL:rozbergs@gmail.com}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
